<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebXR AR Hit-Test</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #info {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.55);
      padding: 8px 16px; border-radius: 20px;
      font-size: 14px; z-index: 10; pointer-events: none;
      white-space: nowrap;
    }
    #enter-ar {
      position: absolute; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px; font-size: 16px;
      background: #4285f4; color: white;
      border: none; border-radius: 30px;
      cursor: pointer; z-index: 10;
      box-shadow: 0 4px 14px rgba(66,133,244,0.5);
    }
    #enter-ar:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="info">Наведите камеру на плоскую поверхность</div>
  <button id="enter-ar" disabled>Проверка поддержки AR…</button>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const button = document.getElementById('enter-ar');
    const infoEl = document.getElementById('info');

    // Базовая сцена Three.js
    const scene = new THREE.Scene();

    // Освещение
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(1, 3, 2);
    scene.add(dirLight);

    // Камера
    const camera = new THREE.PerspectiveCamera();
    camera.matrixAutoUpdate = false;

    // Рендерер
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Маркер
    const reticle = new THREE.Group();
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;

    const ringGeo = new THREE.RingGeometry(0.08, 0.10, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x00d4ff,
      transparent: true,
      opacity: 0.9,
      side: THREE.DoubleSide
    });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    reticle.add(ringMesh);

    const dotGeo = new THREE.CircleGeometry(0.02, 24).rotateX(-Math.PI / 2);
    const dotMat = new THREE.MeshBasicMaterial({
      color: 0x00d4ff,
      transparent: true,
      opacity: 0.6
    });
    reticle.add(new THREE.Mesh(dotGeo, dotMat));

    scene.add(reticle);

    // Шаблон объекта
    function createPlaceableObject() {
      const group = new THREE.Group();

      // Сам куб
      const boxGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
      const boxMat = new THREE.MeshStandardMaterial({
        color: 0xff7a3d,
        roughness: 0.55,
        metalness: 0.15
      });
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.y = 0.125; // ставим на «пол» — точку hit-test
      group.add(box);

      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(boxGeo),
        new THREE.LineBasicMaterial({ color: 0xffffff })
      );
      edges.position.copy(box.position);
      group.add(edges);

      const shadowGeo = new THREE.CircleGeometry(0.16, 32).rotateX(-Math.PI / 2);
      const shadowMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.25
      });
      const shadow = new THREE.Mesh(shadowGeo, shadowMat);
      shadow.position.y = 0.001;
      group.add(shadow);

      return group;
    }

    // Проверка поддержки immersive-ar
    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (supported) {
          button.disabled = false;
          button.textContent = 'Войти в AR';
          button.addEventListener('click', onEnterAR);
        } else {
          button.textContent = 'AR не поддерживается';
          infoEl.textContent = 'immersive-ar недоступен на этом устройстве';
        }
      }).catch((err) => {
        console.error(err);
        button.textContent = 'Ошибка проверки AR';
      });
    } else {
      button.textContent = 'WebXR не поддерживается';
      infoEl.textContent = 'WebXR API недоступен. Используйте WebXR Emulator.';
    }

    // Запуск AR-сессии
    let xrSession = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let localSpace = null;   // стабильный «мировой» space для контента

    async function onEnterAR() {
      try {
        // local-floor — корректный трекинг относительно пола
        xrSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        });

        // Настраиваем рендерер на сессию
        await renderer.xr.setSession(xrSession);

        // Сбрасываем флаги под новую сессию
        hitTestSourceRequested = false;
        hitTestSource = null;

        // Скрываем UI
        button.style.display = 'none';
        infoEl.textContent = 'Наведите на поверхность и коснитесь для размещения';

        xrSession.addEventListener('select', onSelect);

        // По завершении — чистим состояние
        xrSession.addEventListener('end', onSessionEnd);

        // Запускаем цикл рендера
        renderer.setAnimationLoop(onXRFrame);
      } catch (err) {
        console.error('Не удалось запустить AR:', err);
        infoEl.textContent = 'Ошибка запуска AR: ' + err.message;
      }
    }

    function onSessionEnd() {
      xrSession = null;
      hitTestSource = null;
      hitTestSourceRequested = false;
      localSpace = null;
      reticle.visible = false;

      // Удаляем размещённые объекты со сцены
      for (let i = scene.children.length - 1; i >= 0; i--) {
        const c = scene.children[i];
        if (c.userData.isPlaced) scene.remove(c);
      }

      button.style.display = 'block';
      infoEl.textContent = 'Сессия AR завершена';
      renderer.setAnimationLoop(null);
    }

    // Главный цикл XR
    const viewerSpace = new THREE.Group();

    function onXRFrame(time, frame) {
      const session = frame.session;
      xrSession = session;

      // Запрос hit-test source
      if (!hitTestSourceRequested) {
        // Из viewer space пускаем луч от камеры
        session.requestReferenceSpace('viewer').then((viewerRefSpace) => {
          session.requestHitTestSource({ space: viewerRefSpace }).then((source) => {
            hitTestSource = source;
          });
        });
        hitTestSourceRequested = true;
      }

      // Запрос локального пространства
      if (!localSpace) {
        session.requestReferenceSpace('local-floor').then((space) => {
          localSpace = space;
        });
      }

      // Обновляем позицию камеры
      const pose = frame.getViewerPose(localSpace || renderer.xr.getReferenceSpace());
      if (pose) {
        const view = pose.views[0];
        const viewMatrix = new THREE.Matrix4().fromArray(view.transform.matrix);
        const projMatrix = new THREE.Matrix4().fromArray(view.projectionMatrix);
        camera.matrix.fromArray(view.transform.matrix);
        camera.projectionMatrix.copy(projMatrix);
        camera.matrixWorld.copy(viewMatrix);
        camera.matrixWorldInverse.copy(viewMatrix).invert();
      }

      // Hit-test
      if (hitTestSource && localSpace) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const hitPose = hit.getPose(localSpace);

          if (hitPose) {
            reticle.visible = true;
            reticle.matrix.fromArray(hitPose.transform.matrix);
          }
        } else {
          reticle.visible = false;
        }
      }

      renderer.render(scene, camera);
    }

    // Размещение объекта
    function onSelect() {
      if (!reticle.visible) return;

      // Клонируем шаблон и ставим его в мировую позицию маркера
      const obj = createPlaceableObject();
      obj.matrixAutoUpdate = false;
      obj.matrix.copy(reticle.matrix);
      obj.userData.isPlaced = true;

      scene.add(obj);

      infoEl.textContent = 'Объект размещён. Коснитесь ещё раз, чтобы поставить ещё.';
    }

    // Реакция на resize окна
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop((t, frame) => {
      if (frame) onXRFrame(t, frame);
      else renderer.render(scene, camera);
    });
  </script>
</body>
</html>
