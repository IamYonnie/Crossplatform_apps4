<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR: размещение кубов</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #eee; }
    canvas { display: block; }
    #panel { position: absolute; top: 24px; left: 20px; right: 20px; text-align: center; }
    button { padding: 12px 24px; font-size: 18px; cursor: pointer; }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Размещение кубов в AR</h1>
    <p>Нажмите «Запустить AR» и медленно наведите камеру на пол или стол.<br>Когда появится кольцо, коснитесь экрана, чтобы добавить куб.</p>
    <button id="start" disabled>Проверка поддержки AR...</button>
    <p id="status"></p>
  </div>
  <script type="module">
    const button = document.getElementById('start');
    const status = document.getElementById('status');

    if (navigator.xr) {
      if (window.XRWebGLBinding?.prototype?.createProjectionLayer) {
        delete XRWebGLBinding.prototype.createProjectionLayer;
      }
      if (window.XRRenderState?.prototype?.layers) {
        delete XRRenderState.prototype.layers;
      }
    }

    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor');
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 3));

      const marker = new THREE.Mesh(
        new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00cc88, side: THREE.DoubleSide })
      );
      marker.matrixAutoUpdate = false;
      marker.visible = false;
      scene.add(marker);

      const template = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.15, 0.15).translate(0, 0.075, 0),
        new THREE.MeshStandardMaterial({ color: 0x4488ff, roughness: 0.7 })
      );
      const objects = new THREE.Group();
      scene.add(objects);
      let hitTestSource = null;
      let referenceSpace = null;

      function placeObject() {
        if (!marker.visible) return;
        const object = template.clone();
        object.matrixAutoUpdate = false;
        object.matrix.copy(marker.matrix);
        objects.add(object);
      }

      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = '';
        let session;
        try {
          session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test']
          });
          session.addEventListener('end', () => {
            hitTestSource?.cancel();
            hitTestSource = null;
            referenceSpace = null;
            marker.visible = false;
            objects.clear();
            button.disabled = false;
          }, { once: true });
          await renderer.xr.setSession(session);
          referenceSpace = renderer.xr.getReferenceSpace();
          const viewerSpace = await session.requestReferenceSpace('viewer');
          hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
          session.addEventListener('select', placeObject);
        } catch (error) {
          if (session) await session.end().catch(() => {});
          status.textContent = 'Не удалось запустить AR: ' + error.message;
          button.disabled = false;
        }
      });

      renderer.setAnimationLoop((time, frame) => {
        marker.visible = false;
        if (frame && hitTestSource && referenceSpace) {
          const results = frame.getHitTestResults(hitTestSource);
          const pose = results[0]?.getPose(referenceSpace);
          if (pose) {
            marker.matrix.fromArray(pose.transform.matrix);
            marker.visible = true;
          }
        }
        renderer.render(scene, camera);
      });

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      const supported = window.isSecureContext && navigator.xr &&
        await navigator.xr.isSessionSupported('immersive-ar');
      button.disabled = !supported;
      button.textContent = supported ? 'Запустить AR' : 'AR не поддерживается';
      if (!supported) status.textContent = 'Откройте HTTPS-сайт в Chrome на устройстве Android с поддержкой WebXR AR.';
    } catch (error) {
      button.textContent = 'Ошибка запуска';
      status.textContent = error.message;
    }
  </script>
</body>
</html>
