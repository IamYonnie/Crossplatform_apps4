<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Кубик</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        #info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">Наведите камеру на поверхность и коснитесь экрана</div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/webxr/ARButton.js"></script>

    <script>
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        camera.matrixAutoUpdate = false;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);

        const reticleGeo = new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 });
        const reticle = new THREE.Mesh(reticleGeo, reticleMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        const placedGroup = new THREE.Group();
        scene.add(placedGroup);

        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let localRefSpace = null;
        let session = null;

        const arButton = THREE.ARButton.createButton(renderer, {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.getElementById('info') }
        });
        document.body.appendChild(arButton);

        function createCube() {
            const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
            return new THREE.Mesh(geo, mat);
        }

        function onSelect() {
            if (reticle.visible && session) {
                const cube = createCube();
                cube.position.setFromMatrixPosition(reticle.matrixWorld);
                placedGroup.add(cube);
                reticle.visible = false;
            }
        }

        renderer.xr.addEventListener('sessionstart', function () {
            session = renderer.xr.getSession();
            session.addEventListener('select', onSelect);
            document.getElementById('info').style.display = 'block';
        });

        renderer.xr.addEventListener('sessionend', function () {
            hitTestSource = null;
            hitTestSourceRequested = false;
            localRefSpace = null;
            reticle.visible = false;
            document.getElementById('info').style.display = 'none';
            while (placedGroup.children.length > 0) {
                placedGroup.remove(placedGroup.children[0]);
            }
            session = null;
        });

        function render(time, frame) {
            if (frame && !hitTestSourceRequested) {
                session.requestReferenceSpace('viewer').then(function (viewerSpace) {
                    session.requestHitTestSource({ space: viewerSpace }).then(function (source) {
                        hitTestSource = source;
                    });
                });
                session.requestReferenceSpace('local').then(function (space) {
                    localRefSpace = space;
                });
                hitTestSourceRequested = true;
            }

            if (frame && hitTestSource && localRefSpace) {
                const results = frame.getHitTestResults(hitTestSource);
                if (results.length > 0) {
                    const pose = results[0].getPose(localRefSpace);
                    if (pose) {
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        reticle.matrixWorld.copy(reticle.matrix);
                    }
                } else {
                    reticle.visible = false;
                }
            }

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(render);

        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
