<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hit-Test Example</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">Наведите камеру на поверхность и коснитесь экрана для размещения</div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        camera.matrixAutoUpdate = false;

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 3, 2);
        scene.add(directionalLight);

        const reticleGeometry = new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2);
        const reticleMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
            transparent: true,
            opacity: 0.8
        });
        const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        const placedObjectsGroup = new THREE.Group();
        scene.add(placedObjectsGroup);

        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let localReferenceSpace = null;
        let viewerReferenceSpace = null;
        let session = null;

        const arButton = ARButton.createButton(renderer, {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.getElementById('info') }
        });
        document.body.appendChild(arButton);

        function createPlaceableObject() {
            const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
            const materials = [
                new THREE.MeshStandardMaterial({ color: 0xff4444 }),
                new THREE.MeshStandardMaterial({ color: 0x44ff44 }),
                new THREE.MeshStandardMaterial({ color: 0x4444ff }),
                new THREE.MeshStandardMaterial({ color: 0xffff44 }),
                new THREE.MeshStandardMaterial({ color: 0xff44ff }),
                new THREE.MeshStandardMaterial({ color: 0x44ffff })
            ];
            const cube = new THREE.Mesh(geometry, materials);

            const shadowGeometry = new THREE.CircleGeometry(0.1, 32).rotateX(-Math.PI / 2);
            const shadowMaterial = new THREE.MeshBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 0.3
            });
            const shadow = new THREE.Mesh(shadowGeometry, shadowMaterial);
            shadow.position.y = -0.075;
            cube.add(shadow);

            return cube;
        }

        function onSelect() {
            if (reticle.visible && session) {
                const object = createPlaceableObject();
                object.position.setFromMatrixPosition(reticle.matrixWorld);
                placedObjectsGroup.add(object);
                reticle.visible = false;
            }
        }

        renderer.xr.addEventListener('sessionstart', () => {
            session = renderer.xr.getSession();
            session.addEventListener('select', onSelect);
            document.getElementById('info').style.display = 'block';
        });

        renderer.xr.addEventListener('sessionend', () => {
            hitTestSource = null;
            hitTestSourceRequested = false;
            localReferenceSpace = null;
            viewerReferenceSpace = null;
            reticle.visible = false;
            document.getElementById('info').style.display = 'none';

            while (placedObjectsGroup.children.length > 0) {
                placedObjectsGroup.remove(placedObjectsGroup.children[0]);
            }

            session = null;
        });

        function render(time, frame) {
            if (frame && !hitTestSourceRequested) {
                session.requestReferenceSpace('viewer').then((viewerSpace) => {
                    viewerReferenceSpace = viewerSpace;

                    session.requestHitTestSource({ space: viewerSpace })
                        .then((source) => {
                            hitTestSource = source;
                        })
                        .catch((err) => {
                            console.error('Ошибка создания hit-test источника:', err);
                        });
                });

                session.requestReferenceSpace('local').then((space) => {
                    localReferenceSpace = space;
                });

                hitTestSourceRequested = true;
            }

            if (frame && hitTestSource && localReferenceSpace) {
                const hitTestResults = frame.getHitTestResults(hitTestSource);

                if (hitTestResults.length > 0) {
                    const hit = hitTestResults[0];
                    const hitPose = hit.getPose(localReferenceSpace);

                    if (hitPose) {
                        reticle.visible = true;
                        reticle.matrix.fromArray(hitPose.transform.matrix);
                        reticle.matrixWorld.copy(reticle.matrix);
                    }
                } else {
                    reticle.visible = false;
                }
            }

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(render);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
