<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR: размещение собачек</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eeeeee;
    }

    canvas {
      display: block;
    }

    #panel {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      text-align: center;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
    }

    p {
      line-height: 1.5;
    }
  </style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

</head>
<body>
  <div id="panel">
    <h1>Размещение собачек в AR</h1>
    <p>Наведите камеру на поверхность. Когда появится кольцо, нажмите на экран, чтобы добавить собачку.</p>
    <button id="start" disabled>Загрузка...</button>
    <p id="status"></p>
  </div>

  <script type="module">
    const button = document.getElementById('start');
    const status = document.getElementById('status');
    const panel = document.getElementById('panel');

    try {
      const THREE = await import('three');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        70, innerWidth / innerHeight, 0.01, 100
      );

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor');
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 3));

      const marker = new THREE.Mesh(
        new THREE.RingGeometry(0.07, 0.09, 32)
          .rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({
          color: 0x00cc88,
          side: THREE.DoubleSide
        })
      );

      marker.matrixAutoUpdate = false;
      marker.visible = false;
      scene.add(marker);

      let template = null;

      const loader = new GLTFLoader();

      loader.load('./chihuahua_derp_dog.glb', (gltf) => {
        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);

        if (maxSize > 0) {
          model.scale.setScalar(0.35 / maxSize);
        }

        box.setFromObject(model);

        const center = box.getCenter(new THREE.Vector3());

        model.position.x -= center.x;
        model.position.y -= box.min.y;
        model.position.z -= center.z;

        template = model;
      }, undefined, (error) => {
        status.textContent = 'Ошибка загрузки модели: ' + error.message;
      });

      const objects = new THREE.Group();
      scene.add(objects);

      let hitTestSource = null;
      let referenceSpace = null;
      let lastPlacement = -Infinity;

      function placeObject() {
        if (!renderer.xr.isPresenting || !marker.visible || !template) return;

        const now = performance.now();
        if (now - lastPlacement < 250) return;

        lastPlacement = now;

        const object = new THREE.Group();

        const position = new THREE.Vector3();
        const quaternion = new THREE.Quaternion();
        const scale = new THREE.Vector3();

        marker.matrix.decompose(position, quaternion, scale);

        object.position.copy(position);
        object.quaternion.copy(quaternion);
        object.scale.set(1, 1, 1);

        object.add(template.clone(true));
        objects.add(object);
      }

      const controller = renderer.xr.getController(0);
      controller.addEventListener('select', placeObject);
      scene.add(controller);

      renderer.domElement.addEventListener('click', (event) => {
        if (panel.contains(event.target)) return;
        placeObject();
      });

      window.addEventListener('click', (event) => {
        if (panel.contains(event.target)) return;
        placeObject();
      });

      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = '';

        let session = null;
        let stage = 'Запуск AR-сессии';

        try {
          session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['local-floor']
          });

          session.addEventListener('end', () => {
            hitTestSource = null;
            referenceSpace = null;
            marker.visible = false;
            objects.clear();
            panel.hidden = false;
            button.disabled = false;
          }, { once: true });

          stage = 'Подключение рендерера';
          await renderer.xr.setSession(session);

          await new Promise((resolve) => requestAnimationFrame(resolve));

          stage = 'Получение reference space';
          referenceSpace = renderer.xr.getReferenceSpace();

          if (!referenceSpace) {
            referenceSpace = await session.requestReferenceSpace('local-floor');
          }

          stage = 'Получение пространства viewer';
          const viewerSpace = await session.requestReferenceSpace('viewer');

          stage = 'Создание hit-test';
          hitTestSource = await session.requestHitTestSource({
            space: viewerSpace
          });

          panel.hidden = true;
        } catch (error) {
          if (session) {
            await session.end().catch(() => {});
          }

          panel.hidden = false;
          button.disabled = false;
          status.textContent =
            stage + ': ' + error.name + '. ' + error.message;
        }
      });

      renderer.setAnimationLoop((time, frame) => {
        marker.visible = false;

        if (frame && hitTestSource && referenceSpace) {
          const results = frame.getHitTestResults(hitTestSource);

          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);

            if (pose) {
              marker.matrix.fromArray(pose.transform.matrix);
              marker.matrixWorldNeedsUpdate = true;
              marker.visible = true;
            }
          }
        }

        renderer.render(scene, camera);
      });

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      if (!window.isSecureContext) {
        button.textContent = 'Нужен HTTPS';
        status.textContent = 'Откройте опубликованный сайт GitHub Pages.';
      } else if (!navigator.xr) {
        button.textContent = 'WebXR недоступен';
        status.textContent =
          'Проверьте, включён ли эмулятор для этого сайта, и обновите страницу.';
      } else {
        const supported =
          await navigator.xr.isSessionSupported('immersive-ar');

        button.disabled = !supported;
        button.textContent = supported
          ? 'Запустить AR'
          : 'AR не поддерживается';

        if (!supported) {
          status.textContent =
            'Проверьте режим AR и настройки эмулятора для этого сайта.';
        }
      }
    } catch (error) {
      button.disabled = true;
      button.textContent = 'Ошибка загрузки';
      status.textContent = error.name + ': ' + error.message;
    }
  </script>
</body>
</html>
